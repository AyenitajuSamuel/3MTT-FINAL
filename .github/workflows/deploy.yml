
name: School Portal CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Stage 1: Validate HTML / CSS (Simple built-in check)
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          if [ ! -f index.html ]; then
            echo "Error: index.html not found!"
            exit 1
          fi
          echo "✓ HTML files validated successfully"

  # Stage 2: Build & Push Docker Image
  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/school-portal:latest
            ${{ secrets.DOCKER_USERNAME }}/school-portal:${{ github.sha }}

  # Stage 3: Self-Hosted Local Deployment
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout Code locally
        uses: actions/checkout@v4

      - name: Deploy Local Docker Container
        run: |
          export DOCKER_HUB_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export IMAGE_TAG="${{ github.sha }}"

          # Pull new image from Docker Hub
          docker pull $DOCKER_HUB_USERNAME/school-portal:$IMAGE_TAG

          # Deploy container using docker compose
          docker compose up -d school-portal

          # Record current active deployment tag for instant rollback
          echo "$IMAGE_TAG" > LAST_SUCCESSFUL_SHA

          echo "Deployment successful! App is running at http://localhost"