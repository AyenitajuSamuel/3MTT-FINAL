name: School Portal CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Stage 1: Validate HTML / CSS (Runs on GitHub's cloud runners)
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install HTML Validator
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML Files
        run: |
          echo "Validating HTML files..."
          for file in *.html; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              tidy -q -e "$file" || echo "⚠️ Warning: $file has validation issues"
            fi
          done
          echo "✅ HTML validation complete"

  # Stage 2: Build & Push Docker Image (Runs on GitHub's cloud runners)
  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/school-portal:latest
            ${{ secrets.DOCKER_USERNAME }}/school-portal:${{ github.sha }}

  # Stage 3: Self-Hosted Local Deployment
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout Code locally
        uses: actions/checkout@v4

      - name: Deploy Local Docker Container
        run: |
          export DOCKER_HUB_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export IMAGE_TAG="${{ github.sha }}"

          # Get absolute path to project directory
          PROJECT_DIR="${GITHUB_WORKSPACE}"

          # Pull new image and restart container locally
          docker pull $DOCKER_HUB_USERNAME/school-portal:$IMAGE_TAG

          # Navigate to project directory and start container
          cd "$PROJECT_DIR"
          docker compose up -d school-portal

          # Verify container is running
          if docker ps | grep -q school_portal_app; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed - container not running"
            exit 1
          fi

          # Record current active deployment tag for instant rollback
          echo "$IMAGE_TAG" > "$PROJECT_DIR/LAST_SUCCESSFUL_SHA"
          echo "📝 Saved deployment tag: $IMAGE_TAG"