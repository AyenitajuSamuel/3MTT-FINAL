
name: Rollback School Portal

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target Commit SHA tag to revert to (Leave blank to use previous successful SHA)'
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Revert Server Container Version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export DOCKER_HUB_USERNAME="${{ secrets.DOCKER_USERNAME }}"

            TARGET_SHA="${{ github.event.inputs.target_sha }}"
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA=$(cat /path/to/school-portal/LAST_SUCCESSFUL_SHA)
            fi

            echo "Rolling back deployment to tag: $TARGET_SHA"
            export IMAGE_TAG="$TARGET_SHA"

            docker pull $DOCKER_HUB_USERNAME/school-portal:$IMAGE_TAG
            docker compose -f /path/to/school-portal/docker-compose.yml up -d school-portal